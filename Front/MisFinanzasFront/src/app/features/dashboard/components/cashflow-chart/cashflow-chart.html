<div class="bg-surface-container-lowest rounded-2xl p-lg shadow-soft border border-outline-variant/30 flex flex-col gap-lg">
  <div class="flex flex-col sm:flex-row gap-sm sm:items-center justify-between">
    <div>
      <h3 class="text-headline-md font-bold text-on-surface">Flujo de caja</h3>
      <p class="text-label-sm text-on-surface-variant">Ingresos y gastos por mes</p>
    </div>
    <div class="flex gap-xs bg-surface-container rounded-full p-xs w-fit" role="tablist" aria-label="Rango de tiempo">
      @for (option of ranges; track option) {
        <button
          type="button"
          role="tab"
          [attr.aria-selected]="option === range()"
          (click)="setRange(option)"
          class="px-md py-sm rounded-full text-label-sm transition-colors"
          [class.bg-surface-container-lowest]="option === range()"
          [class.shadow-soft]="option === range()"
          [class.text-primary]="option === range()"
          [class.font-bold]="option === range()"
          [class.text-on-surface-variant]="option !== range()"
        >
          {{ option }}
        </button>
      }
    </div>
  </div>

  <div class="flex items-center gap-md">
    <div class="flex items-center gap-xs text-label-sm text-on-surface-variant">
      <span class="w-3 h-3 rounded-full bg-primary"></span> Ingresos
    </div>
    <div class="flex items-center gap-xs text-label-sm text-on-surface-variant">
      <span class="w-3 h-3 rounded-full bg-outline"></span> Gastos
    </div>
  </div>

  @if (hasData()) {
    <div class="flex items-end gap-sm h-48 pt-xs" role="img" aria-label="Gráfico de flujo de caja por mes">
      @for (bar of bars(); track bar.month) {
        <div class="flex-1 flex flex-col items-center gap-xs h-full justify-end min-w-0 group">
          <div class="flex flex-col items-center gap-[3px] w-full max-w-[28px] justify-end" style="flex:1">
            <span class="text-[10px] text-on-surface-variant opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">
              {{ formatCurrency(bar.incomes) }}
            </span>
            <div class="w-full bg-primary rounded-t-sm" [style.height.%]="bar.incomeHeight" [title]="formatCurrency(bar.incomes)"></div>
          </div>
          <div class="flex flex-col items-center gap-[3px] w-full max-w-[28px] justify-end" style="flex:1">
            <div class="w-full bg-outline/50 rounded-t-sm" [style.height.%]="bar.expenseHeight" [title]="formatCurrency(bar.expenses)"></div>
          </div>
          <span class="text-[10px] text-on-surface-variant">{{ formatMonth(bar.month) }}</span>
        </div>
      }
    </div>
  } @else {
    <div class="h-48 flex items-center justify-center text-label-sm text-on-surface-variant">
      Sin datos para el periodo seleccionado.
    </div>
  }
</div>
