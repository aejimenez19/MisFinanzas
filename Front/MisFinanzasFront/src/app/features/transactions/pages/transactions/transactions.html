<div class="flex flex-col gap-lg">
  <div class="flex flex-col gap-xs">
    <h2 class="text-display-lg-mobile md:text-display-lg font-bold text-on-background">Transacciones</h2>
    <p class="text-body-lg text-on-surface-variant">Administra y revisa tu flujo de caja.</p>
  </div>

  @if (loadError()) {
    <div class="bg-error-container text-on-error-container rounded-2xl p-md text-body-md" role="alert">
      {{ loadError() }}
    </div>
  }

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-md lg:gap-lg">
    <app-transaction-form
      class="lg:col-span-1"
      [expenseCategories]="expenseCategories()"
      [incomeCategories]="incomeCategories()"
      (created)="onTransactionCreated($event)"
    />
    <app-transaction-list
      class="lg:col-span-2"
      [transactions]="transactions()"
      [categories]="allCategories()"
      [loading]="loading()"
    />
  </div>
</div>
